server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression GZIP
    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml
               application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ---------------------------------------------------------------
    # Stratégie de cache :
    #
    # Les fichiers JS/CSS générés par Angular sont TOUJOURS hashés
    # (ex: main.4a9f1bc2.js) → immutables, cache 1 an sans revalidation.
    #
    # Les assets dans /assets/ (images, i18n, fonts embed, etc.)
    # peuvent changer de contenu sans changer de nom → on force la
    # revalidation via ETag/Last-Modified (no-cache = le navigateur
    # demande toujours au serveur, qui répond 304 si inchangé).
    # ---------------------------------------------------------------

    # JS et CSS hashés par Angular → immuables
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts → ne changent jamais de contenu → immuables
    location ~* \.(woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tout ce qui est dans /assets/ (images, i18n, icônes non-hashées…)
    # → revalidation systématique via ETag (304 si inchangé = pas de transfert)
    location /assets/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # PAS de cache pour environment.json (injecté au runtime par Docker)
    location = /assets/environment.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback : toute route inconnue → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Désactiver le cache pour index.html (toujours frais)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}