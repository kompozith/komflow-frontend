<app-auth-layout title="Welcome back" subtitle="At a step to your growth — Let's get started">

  <form [formGroup]="form" (ngSubmit)="submit()" class="tw:flex tw:flex-col tw:gap-6">

    <ds-text-field
      [control]="form.controls.email"
      label="Email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      [errorMessages]="{ required: 'Email is required.', email: 'Please enter a valid email.' }"
    />

    <ds-text-field
      [control]="form.controls.password"
      label="Password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      [errorMessages]="{ required: 'Password is required.' }"
    />

    <!-- Remember me + Forgot password -->
    <div class="tw:flex tw:items-center tw:justify-between">
      <label class="tw:flex tw:items-center tw:gap-2 tw:text-sm tw:text-on-surface tw:cursor-pointer tw:select-none">
        <input
          type="checkbox"
          formControlName="rememberMe"
          class="tw:h-4 tw:w-4 tw:rounded tw:border-outline-variant tw:text-primary tw:focus:ring-2 tw:focus:ring-primary/30 tw:accent-primary"
        />
        Remember me
      </label>
      <a
        [routerLink]="['/authentication/password-reset/initiate']"
        class="tw:text-sm tw:font-semibold tw:text-primary tw:no-underline tw:hover:underline"
      >Forgot password?</a>
    </div>

    @if (loginError()) {
      <ds-alert variant="error">{{ loginError() }}</ds-alert>
    }

    <ds-button type="submit" [disabled]="!form.valid" [loading]="isLoading()" loadingText="Signing in...">
      Sign In
    </ds-button>

  </form>

  <!-- OAuth divider -->
  <div class="or-border tw:mt-6"><span class="or-border__text">Or sign in with</span></div>

  <!-- Google -->
  <div class="tw:mt-4">
    <ds-button variant="outline" type="button">
      <img src="/assets/images/svgs/google-icon.svg" alt="" width="16" />
      <span>Google</span>
    </ds-button>
  </div>

  <!-- Footer links -->
  <div class="tw:flex tw:items-center tw:justify-between tw:mt-6">
    <span class="tw:text-sm tw:font-medium tw:text-on-surface">
      New on Komflow?
      <a
        [routerLink]="['/authentication/side-register']"
        class="tw:no-underline tw:text-primary tw:font-semibold"
      >Sign up</a>
    </span>
    <a
      [routerLink]="['/help']"
      class="tw:no-underline tw:text-sm tw:font-semibold tw:text-on-surface-variant"
    >Need help?</a>
  </div>

</app-auth-layout>
