<app-auth-layout title="Reset your password" subtitle="Enter your email to receive a verification code.">

  <form [formGroup]="form" (ngSubmit)="submit()" class="tw:flex tw:flex-col tw:gap-6">

    <ds-text-field
      [control]="form.controls.email"
      label="Email address"
      type="email"
      placeholder="example@email.com"
      autocomplete="email"
      [errorMessages]="{ required: 'Email is required.', email: 'Please enter a valid email.' }"
    />

    @if (error()) {
      <ds-alert variant="error">{{ error() }}</ds-alert>
    }

    <ds-button type="submit" [disabled]="!form.valid" [loading]="isLoading()" loadingText="Sending...">
      Send Verification Code
    </ds-button>

    <a
      [routerLink]="['/authentication/login']"
      class="ds-btn ds-btn--outline tw:no-underline"
    >Back to Login</a>

  </form>

</app-auth-layout>
