<app-auth-layout
  title="Verify code"
  [subtitle]="contact ? 'Enter the 6-digit verification code sent to ' + contact : 'Enter the 6-digit verification code'"
>

  <form [formGroup]="form" (ngSubmit)="submit()" class="tw:flex tw:flex-col tw:gap-6">

    <!-- OTP digit inputs -->
    <div class="otp-container tw:flex tw:justify-between">
      <input type="text" id="digit1" formControlName="digit1" maxlength="1" inputmode="numeric"
        class="otp-input" (input)="onDigitInput($event, 1)" (keydown)="onDigitKeyDown($event, 1)"
        (blur)="onDigitBlur(1)" (paste)="onDigitPaste($event, 1)"
        [class.otp-error]="f['digit1'].touched && f['digit1'].invalid" />
      <input type="text" id="digit2" formControlName="digit2" maxlength="1" inputmode="numeric"
        class="otp-input" (input)="onDigitInput($event, 2)" (keydown)="onDigitKeyDown($event, 2)"
        (blur)="onDigitBlur(2)" (paste)="onDigitPaste($event, 2)"
        [class.otp-error]="f['digit2'].touched && f['digit2'].invalid" />
      <input type="text" id="digit3" formControlName="digit3" maxlength="1" inputmode="numeric"
        class="otp-input" (input)="onDigitInput($event, 3)" (keydown)="onDigitKeyDown($event, 3)"
        (blur)="onDigitBlur(3)" (paste)="onDigitPaste($event, 3)"
        [class.otp-error]="f['digit3'].touched && f['digit3'].invalid" />
      <input type="text" id="digit4" formControlName="digit4" maxlength="1" inputmode="numeric"
        class="otp-input" (input)="onDigitInput($event, 4)" (keydown)="onDigitKeyDown($event, 4)"
        (blur)="onDigitBlur(4)" (paste)="onDigitPaste($event, 4)"
        [class.otp-error]="f['digit4'].touched && f['digit4'].invalid" />
      <input type="text" id="digit5" formControlName="digit5" maxlength="1" inputmode="numeric"
        class="otp-input" (input)="onDigitInput($event, 5)" (keydown)="onDigitKeyDown($event, 5)"
        (blur)="onDigitBlur(5)" (paste)="onDigitPaste($event, 5)"
        [class.otp-error]="f['digit5'].touched && f['digit5'].invalid" />
      <input type="text" id="digit6" formControlName="digit6" maxlength="1" inputmode="numeric"
        class="otp-input" (input)="onDigitInput($event, 6)" (keydown)="onDigitKeyDown($event, 6)"
        (blur)="onDigitBlur(6)" (paste)="onDigitPaste($event, 6)"
        [class.otp-error]="f['digit6'].touched && f['digit6'].invalid" />
    </div>

    @if (error()) {
      <ds-alert variant="error">{{ error() }}</ds-alert>
    }

    <ds-button type="submit" [disabled]="!form.valid" [loading]="isLoading()" loadingText="Verifying...">
      Verify Code
    </ds-button>

    <a
      [routerLink]="['/authentication/login']"
      class="ds-btn ds-btn--outline tw:no-underline"
    >Back to Login</a>

  </form>

</app-auth-layout>
