<app-auth-layout title="Set a new password" subtitle="Enter your new password below.">

  <form [formGroup]="form" (ngSubmit)="submit()" class="tw:flex tw:flex-col tw:gap-6">

    <ds-text-field
      [control]="form.controls.newPassword"
      label="New Password"
      type="password"
      placeholder="Enter your new password"
      autocomplete="new-password"
      [errorMessages]="{ required: 'Password is required.', minlength: 'Password must be at least 8 characters.' }"
    />

    <div class="tw:flex tw:flex-col tw:gap-2">
      <ds-text-field
        [control]="form.controls.confirmPassword"
        label="Confirm Password"
        type="password"
        placeholder="Confirm your new password"
        autocomplete="new-password"
        [errorMessages]="{ required: 'Confirmation is required.' }"
      />
      @if (showPasswordMismatch()) {
        <span class="ds-error-text">Passwords do not match.</span>
      }
    </div>

    @if (error()) {
      <ds-alert variant="error">{{ error() }}</ds-alert>
    }

    <ds-button type="submit" [disabled]="!form.valid" [loading]="isLoading()" loadingText="Resetting...">
      Reset Password
    </ds-button>

    <a
      [routerLink]="['/authentication/login']"
      class="ds-btn ds-btn--outline tw:no-underline"
    >Back to Login</a>

  </form>

</app-auth-layout>
