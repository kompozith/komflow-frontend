<div class="tw:grid tw:grid-cols-1 tw:sm:grid-cols-2 tw:gap-x-4 tw:gap-y-2 tw:rounded-xl tw:bg-primary-container/40 tw:p-4">
  @for (rule of rules(); track rule.label) {
    <div class="tw:flex tw:items-center tw:gap-2 tw:text-sm" [class.tw:text-success]="rule.met" [class.tw:text-on-surface-variant]="!rule.met">
      @if (rule.met) {
        <svg class="tw:h-4 tw:w-4 tw:shrink-0 tw:text-success" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M16.704 5.29a1 1 0 0 1 0 1.415l-7.5 7.5a1 1 0 0 1-1.415 0l-3.5-3.5a1 1 0 1 1 1.415-1.415L8.5 12.086l6.79-6.796a1 1 0 0 1 1.414 0Z" clip-rule="evenodd" />
        </svg>
      } @else {
        <svg class="tw:h-4 tw:w-4 tw:shrink-0 tw:text-outline" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
        </svg>
      }
      <span>{{ rule.label }}</span>
    </div>
  }
</div>
