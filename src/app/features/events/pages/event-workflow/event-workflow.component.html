<ng-container *ngIf="!loading && event; else stateTpl">
  <app-event-form
    [initialEvent]="event"
    [submitLabel]="'Sauvegarder le workflow'"
    [submitting]="saving"
    [workflowOnly]="true"
    (formSubmitted)="update($event)"
    (cancelled)="cancel()"
  >
  </app-event-form>
</ng-container>

<ng-template #stateTpl>
  <div class="cardWithShadow p-4">Chargement du workflow...</div>
</ng-template>
