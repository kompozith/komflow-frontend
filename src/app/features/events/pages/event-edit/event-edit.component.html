@if (loading) {
  <div class="py-5 d-flex justify-content-center">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
}

@if (!loading && event) {
  <app-event-form
    [initialEvent]="event"
    [submitting]="saving"
    submitLabel="Mettre a jour l evenement"
    (formSubmitted)="update($event)"
    (cancelled)="cancel()"
  ></app-event-form>
}
