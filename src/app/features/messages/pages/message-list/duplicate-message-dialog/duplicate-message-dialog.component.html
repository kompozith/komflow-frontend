<div class="d-flex align-items-center justify-content-between px-3 pt-3 pb-2">
  <div class="d-flex align-items-center gap-8">
    <mat-icon class="text-primary" style="font-size:20px;width:20px;height:20px">content_copy</mat-icon>
    <h5 class="mb-0">Dupliquer le message</h5>
  </div>
  <button mat-icon-button mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="px-3 pb-2">
  <p class="text-muted f-s-14 mb-3">
    Une copie exacte de <strong>{{ data.message.title }}</strong> sera créée.
    Donnez-lui un nouveau titre.
  </p>

  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Titre du nouveau message</mat-label>
      <mat-icon matPrefix>title</mat-icon>
      <input
        matInput
        formControlName="title"
        placeholder="Copie de …"
        autocomplete="off">
      <mat-hint align="end">{{ form.value.title?.length || 0 }}/255</mat-hint>
      <mat-error *ngIf="form.get('title')?.errors?.['required']">Le titre est requis</mat-error>
      <mat-error *ngIf="form.get('title')?.errors?.['maxlength']">255 caractères maximum</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="px-3 pb-3 gap-8">
  <button mat-stroked-button mat-dialog-close [disabled]="isDuplicating">Annuler</button>
  <button mat-flat-button color="primary" (click)="onDuplicate()" [disabled]="isDuplicating">
    <mat-spinner diameter="18" *ngIf="isDuplicating" class="me-1"></mat-spinner>
    <mat-icon *ngIf="!isDuplicating" class="me-1">content_copy</mat-icon>
    {{ isDuplicating ? 'Duplication…' : 'Dupliquer' }}
  </button>
</mat-dialog-actions>
