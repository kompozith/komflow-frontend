<div mat-dialog-content>
  <div class="d-flex align-items-center justify-content-between m-b-16">
    <h4 class="f-s-16 f-w-600 m-b-16">{{ dialogTitle() }}</h4>
    <button
      mat-icon-button
      mat-dialog-close
      class="d-flex justify-content-center"
      type="button"
      >
      <i-tabler name="x" class="icon-20 d-flex"></i-tabler>
    </button>
  </div>

  <form [formGroup]="eventForm" class="event-form">
    <div class="row">
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" placeholder="Event title" required />
        </mat-form-field>
      </div>

      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Description</mat-label>
          <textarea matInput rows="3" formControlName="description" placeholder="Event description"></textarea>
        </mat-form-field>
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" placeholder="Location" />
        </mat-form-field>
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Timezone</mat-label>
          <input matInput formControlName="timezone" placeholder="Timezone" />
        </mat-form-field>
      </div>

      <div class="col-sm-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Start date</mat-label>
          <input matInput type="date" formControlName="startDate" />
        </mat-form-field>
      </div>

      <div class="col-sm-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Start time</mat-label>
          <input matInput type="time" formControlName="startTime" />
        </mat-form-field>
      </div>

      <div class="col-sm-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>End date</mat-label>
          <input matInput type="date" formControlName="endDate" />
        </mat-form-field>
      </div>

      <div class="col-sm-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>End time</mat-label>
          <input matInput type="time" formControlName="endTime" />
          @if (eventForm.get('endDate')?.errors?.['beforeStart']) {
            <mat-error>
              End must be after start
            </mat-error>
          }
        </mat-form-field>
      </div>

    </div>

    <div class="d-flex align-items-center justify-content-end gap-12">
      <button
        mat-flat-button
        color="primary"
        type="button"
        (click)="onSave()"
        [disabled]="eventForm.invalid"
        aria-label="SAVE"
        >
        Save
      </button>
      <button mat-button mat-dialog-close class="bg-error text-white" type="button">
        Cancel
      </button>
    </div>
  </form>
</div>
