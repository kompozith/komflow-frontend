<div class="row">
  <div class="col-12">
    <mat-card class="cardWithShadow">
      <mat-card-header>
        <mat-card-title>Edit Contact</mat-card-title>
        <mat-card-subtitle>Update contact information</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content *ngIf="!isLoading">
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Person ID</mat-label>
                <input matInput formControlName="personId" type="number" placeholder="Enter person ID">
                <mat-error *ngIf="contactForm.get('personId')?.invalid && contactForm.get('personId')?.touched">
                  <span *ngIf="contactForm.get('personId')?.errors?.['required']">Person ID is required</span>
                </mat-error>
              </mat-form-field>
            </div>

            <div class="col-md-6 d-flex align-items-center">
              <mat-slide-toggle formControlName="enabled" color="primary">Enabled</mat-slide-toggle>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Last Message Received At</mat-label>
                <input matInput formControlName="lastMessageReceivedAt" type="datetime-local">
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col-12">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Tags</mat-label>
                <mat-select formControlName="tagIds" multiple>
                  <mat-option *ngFor="let tag of availableTags" [value]="tag.id">
                    {{ tag.name }}
                  </mat-option>
                </mat-select>
                <mat-hint>Select tags to categorize this contact</mat-hint>
              </mat-form-field>
            </div>
          </div>

          <div class="row mt-3">
            <div class="col-12">
              <div class="d-flex justify-content-end gap-2">
                <button mat-stroked-button type="button" (click)="onCancel()">
                  Cancel
                </button>
                <button
                  mat-flat-button
                  color="primary"
                  type="submit"
                  [disabled]="isSaving || contactForm.invalid">
                  <mat-spinner diameter="20" *ngIf="isSaving"></mat-spinner>
                  <span *ngIf="!isSaving">Update Contact</span>
                </button>
              </div>
            </div>
          </div>
        </form>
      </mat-card-content>

      <mat-card-content *ngIf="isLoading">
        <div class="d-flex justify-content-center align-items-center p-4">
          <mat-spinner diameter="40"></mat-spinner>
          <span class="ml-2">Loading contact...</span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
