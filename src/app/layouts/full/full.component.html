<span [dir]="options.dir!">
  <div class="mainWrapper" [ngClass]="{ cardBorder: options.cardBorder }">
    <!-- ============================================================== -->
    <!-- Sidebar: filters (page-specific) + workspace switcher -->
    <!-- ============================================================== -->
    @if (sidenavService.isOver() && sidenavService.isOpen()) {
      <div class="tw:fixed tw:inset-0 tw:z-40 tw:bg-black/40" (click)="sidenavService.close()"></div>
    }
    <aside
      class="sidebarNav tw:h-screen tw:min-h-0"
      [ngClass]="{
        'tw:fixed tw:inset-y-0 tw:left-0 tw:z-50': sidenavService.isOver(),
        'tw:-translate-x-full': sidenavService.isOver() && !sidenavService.isOpen(),
        'tw:hidden': !sidenavService.isOver() && !sidenavService.isOpen()
      }"
    >
      <div class="flex-layout">
        <app-sidebar [showToggle]="sidenavService.isOver()"></app-sidebar>
      </div>
    </aside>

    <!-- ============================================================== -->
    <!-- Main Content -->
    <!-- ============================================================== -->
    <div class="contentWrapper tw:flex tw:min-h-0 tw:min-w-0 tw:flex-1 tw:flex-col tw:overflow-y-auto" #content>
      <app-header [showToggle]="!sidenavService.isOver()"></app-header>

      <main class="pageWrapper" [ngClass]="{ maxWidth: options.boxed }">
        <!-- ============================================================== -->
        <!-- Outlet -->
        <!-- ============================================================== -->
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  <app-tab-bar></app-tab-bar>

  @if (workspaceService.showCreateWorkspaceModal()) {
    <app-create-workspace-modal />
  }
</span>
